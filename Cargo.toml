[package]
name = "ukrainian-tn"
version = "0.7.0"
edition = "2024"
rust-version = "1.99"
description = "Ukrainian text normalization, tokenization and sentence splitting: reads numbers, dates, units, currencies and abbreviations as words"
documentation = "https://docs.rs/ukrainian-tn"
repository = "https://github.com/RustedBytes/ukrainian-tn"
license = "MIT"
readme = "README.md"
keywords = ["ukrainian", "nlp", "normalization", "tokenizer", "tts"]
categories = ["text-processing", "internationalization"]

# An explicit allowlist, so the published tarball holds exactly the sources,
# lexicons and tests the crate needs and nothing else.
include = [
    "/src/**/*.rs",
    "/data/lexicons/*.tsv",
    "/tests/**/*.rs",
    "/benches/**/*.rs",
    "/tests/data/*.tsv",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
fancy-regex = "0.20.0"
pyo3 = { version = "0.30.1", optional = true, features = ["abi3-py39"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "text_processing"
harness = false
